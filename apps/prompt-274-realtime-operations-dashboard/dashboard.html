<!doctype html><html><head><meta charset="utf-8"><title>Operations capstone</title><style>body{font:24px Segoe UI;background:#eef2ff;color:#13204a;margin:48px}main{background:white;border-radius:24px;padding:40px}h1{font-size:36px}section{display:flex;gap:25px;margin:35px 0}article{background:#e4f2ff;padding:30px;border-radius:18px;min-width:280px}strong{display:block;font-size:60px;color:#6237c5}button{font:24px Segoe UI;background:#5931c2;color:white;border:0;padding:20px;border-radius:12px}#status{margin-top:28px;font-size:27px}</style></head><body><main><h1>.NET 11 · Real-time operations</h1><p>Authenticated tenant alpha · bounded background queue · actual SignalR events</p><section><article>Live event count<strong id="live">0</strong></article><article>Cached API snapshot<strong id="snapshot">0</strong></article></section><button id="enqueue" disabled>Process one job</button><div id="status">Connecting…</div><p>Expected invariant: live event and cached snapshot agree after completion.</p></main><script src="/signalr.min.js"></script><script>
const token=sessionStorage.getItem('fixture-token'),headers={Authorization:'Bearer '+token};const connection=new signalR.HubConnectionBuilder().withUrl('/hub',{accessTokenFactory:()=>token}).build();
connection.on('changed',async value=>{document.querySelector('#live').textContent=value;const snapshot=await fetch('/snapshot',{headers}).then(r=>r.json());document.querySelector('#snapshot').textContent=snapshot.value;document.querySelector('#status').textContent=value===snapshot.value?'Completed: live and cached values agree.':'Failure: live event changed, but cached snapshot is stale.';window.result={live:value,snapshot:snapshot.value};window.complete=true;});
(async()=>{const initial=await fetch('/snapshot',{headers}).then(r=>r.json());document.querySelector('#snapshot').textContent=initial.value;await connection.start();document.querySelector('#status').textContent='Connected. Ready to process a job.';document.querySelector('#enqueue').disabled=false;})();document.querySelector('#enqueue').onclick=async()=>{document.querySelector('#enqueue').disabled=true;await fetch('/jobs',{method:'POST',headers});};</script></body></html>
