<!doctype html><html><meta charset="utf-8"><title>Grounded RAG lab</title><style>body{font:22px Segoe UI;background:#f4f1ff;color:#20113f;margin:32px}main{max-width:1150px;margin:auto}header{background:#4826a8;color:white;border-radius:18px;padding:22px}section{background:white;border:2px solid #cdbde8;border-radius:14px;padding:24px;margin-top:18px}input{font:22px Segoe UI;padding:12px;width:65%}button{font:22px Segoe UI;padding:14px;color:white;background:#6232c1;border:0;border-radius:8px}#answer{font-size:28px;line-height:1.5}a{color:#5426a8}</style><main><header><small>.NET 11 • PROMPT 206 • ACTUAL DATABASE AND LOCAL MODEL</small><h1>Grounded answers with source citations</h1></header><section><input id="query" value="rotate API keys"><button id="ask">Ask the document collection</button><p id="status">Ready</p></section><section><h2>Application result</h2><p id="answer"></p><div id="citations"></div></section></main><script>document.querySelector('#ask').onclick=async()=>{const button=document.querySelector('#ask');button.disabled=true;document.querySelector('#status').textContent='Retrieving';try{const result=await(await fetch('/ask?q='+encodeURIComponent(document.querySelector('#query').value))).json();document.querySelector('#answer').textContent=result.answer;const citations=document.querySelector('#citations');citations.replaceChildren();for(const c of result.citations){const a=document.createElement('a');a.textContent='Source: '+c.id+' • version '+c.version;a.href=c.url;citations.append(a);}document.querySelector('#status').textContent=result.abstained?'Abstained':'Answered with evidence';}finally{button.disabled=false;}};</script></html>
